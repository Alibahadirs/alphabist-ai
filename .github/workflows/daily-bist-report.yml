name: Daily BIST Technical Report

on:
  schedule:
    # Türkiye saati 19:00 (UTC+3), hafta içi
    - cron: "0 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-bist-report
  cancel-in-progress: false

jobs:
  scan-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Istanbul
      ALPHABIST_GMAIL_SENDER: ${{ secrets.ALPHABIST_GMAIL_SENDER }}
      ALPHABIST_REPORT_RECIPIENT: ${{ secrets.ALPHABIST_REPORT_RECIPIENT }}
      ALPHABIST_GMAIL_APP_PASSWORD: ${{ secrets.ALPHABIST_GMAIL_APP_PASSWORD }}
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v5
      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install -g borsa-api@1.2.0
      - name: Tüm BIST hisselerini tara ve e-posta gönder
        run: python -m app.daily_scan.runner --force
